name: Import audited source payload

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import source tree when archive exists
        shell: bash
        run: |
          set -euo pipefail
          archive="GLIC-Sem_source_20260803.zip"
          if [[ ! -f "$archive" ]]; then
            echo "No source archive is present; nothing to import."
            exit 0
          fi

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          unzip -q "$archive" -d "$temp_dir"
          rsync -a --exclude='.git/' "$temp_dir/" "$GITHUB_WORKSPACE/"
          rm -f "$archive"

          git add -A
          python3 tools/audit_git_payload.py --repo .

          if git diff --cached --quiet; then
            echo "The imported source tree produced no changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import audited GLIC-Sem source"
          git push

